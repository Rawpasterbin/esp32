name = "water-valve-scheduler"
main = "worker/schedule-worker.js"
compatibility_date = "2024-09-01"

# KV: ต้องสร้างก่อน แล้วใส่ id ลงไป
#   wrangler kv namespace create SCHEDULE_KV
[[kv_namespaces]]
binding = "SCHEDULE_KV"
id = "0685a046b05848818ceb2146ddcec213"

# Cron ทุก 1 นาที
[triggers]
crons = ["* * * * *"]

# ตัวแปรที่ไม่ใช่ secret
[vars]
MQTT_WS_URL = "wss://74bd39d864644eebb6efba20dadd4e93.s1.eu.hivemq.cloud:8884/mqtt"
MQTT_CLIENT_ID = "cf_worker_scheduler"

# MQTT_USER / MQTT_PASS ต้องตั้งเป็น Worker secret เท่านั้น:
#   npx wrangler secret put MQTT_USER --config wrangler.toml
#   npx wrangler secret put MQTT_PASS --config wrangler.toml
# Credential เดิมที่เคยอยู่ในไฟล์นี้ถือว่ารั่วแล้ว ต้อง rotate ที่ HiveMQ ก่อนใช้งานต่อ
